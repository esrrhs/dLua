name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
        
    - name: prepare-lua
      run: |
        sudo apt-get update
        sudo apt-get install -y libreadline-dev wget build-essential
        wget https://www.lua.org/ftp/lua-5.3.4.tar.gz
        tar -xf lua-5.3.4.tar.gz
        cd lua-5.3.4
        make linux
        sudo make install
        
    - name: build
      run: |
        ./build.sh
        
    - name: test
      run: |
        ./test_unit
